# Publicación de una versión (docs/despliegue.md §3). Dos formas:
#   - Automática: un push que cambia el archivo VERSION (en main o en la rama de trabajo) corre la CI completa y,
#     si está en verde, crea el tag vX.Y.Z y el release con sus assets. Si ese release ya existe, no hace nada; una versión menor que la última se rechaza.
#   - Manual: publicar un release con tag vX.Y.Z en GitHub; el tag debe coincidir con VERSION. O correr el workflow a mano
#     (workflow_dispatch) en la rama: hace lo mismo que el push, útil si la CI falló y ya se arregló.
# Arma el paquete, lo firma con ed25519 si existe el secreto GROWTH_RELEASE_SIGNING_KEY (opcional) y sube los
# assets que usan install.sh y el actualizador, más el plugin de WordPress.
name: Release

on:
  push:
    # ccr-2bf1a9d4-0xdcjo: la rama donde vive el código hasta que se fusione a main; luego se quita de aquí.
    branches: [main, ccr-2bf1a9d4-0xdcjo]
    paths: [VERSION]
  release:
    types: [published]
  # Volver a intentar la publicación de VERSION (p. ej., después de arreglar la CI) sin cambiar de versión.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Versión a publicar
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      tag: ${{ steps.v.outputs.tag }}
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - id: v
        name: Tag, VERSION y releases existentes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION «$VERSION» no tiene la forma X.Y.Z"; exit 1; }
          if [ "$EVENT" = release ]; then
            [ "$RELEASE_TAG" = "v$VERSION" ] || { echo "::error::El tag $RELEASE_TAG no coincide con el archivo VERSION ($VERSION). Sube VERSION y vuelve a publicar."; exit 1; }
            echo "mode=upload" >> "$GITHUB_OUTPUT"
          else
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::notice::El release v$VERSION ya existe: no se publica nada."
              echo "skip=1" >> "$GITHUB_OUTPUT"
            else
              LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
              LATEST=${LATEST#v}
              if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
                echo "::error::VERSION ($VERSION) es menor que la última publicada ($LATEST)."; exit 1
              fi
            fi
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # Nada se publica en rojo (CLAUDE.md §6): la misma CI de main y de los PR, antes de armar el paquete.
  ci:
    name: CI antes de publicar
    needs: prepare
    if: needs.prepare.outputs.skip != '1'
    uses: ./.github/workflows/ci.yml

  package:
    name: Paquete de la versión
    needs: [prepare, ci]
    if: needs.prepare.outputs.skip != '1'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      MODE: ${{ needs.prepare.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: VERSION
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: ¿Hay llave de firma?
        env:
          GROWTH_RELEASE_SIGNING_KEY: ${{ secrets.GROWTH_RELEASE_SIGNING_KEY }}
        run: |
          # La firma es opcional (docs/despliegue.md §3): sin el secreto, la versión sale solo con sha256.
          if [ -n "$GROWTH_RELEASE_SIGNING_KEY" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::notice::Sin el secreto GROWTH_RELEASE_SIGNING_KEY: la versión se publica sin firma (solo sha256)."
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, zip, pcntl, sodium, gd, exif, gmp, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: El uv.lock del ML está al día
        working-directory: hub/ml
        run: uv lock --check

      - name: Llave pública (derivada de la privada)
        if: env.SIGNED == '1'
        env:
          GROWTH_RELEASE_SIGNING_KEY: ${{ secrets.GROWTH_RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$GROWTH_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          openssl pkey -in "$RUNNER_TEMP/signing.pem" -pubout -out "$RUNNER_TEMP/release-signing.pub.pem"
          rm -f "$RUNNER_TEMP/signing.pem"
          echo "GROWTH_RELEASE_PUBKEY_FILE=$RUNNER_TEMP/release-signing.pub.pem" >> "$GITHUB_ENV"

      - name: Armar el paquete
        env:
          GROWTH_COMMIT: ${{ github.sha }}
        run: infra/release/build.sh "$VERSION" dist

      - name: Plugin de WordPress (Imagina Growth Connector)
        run: connector/bin/build-zip.sh dist

      - name: Firmar y verificar
        if: env.SIGNED == '1'
        env:
          GROWTH_RELEASE_SIGNING_KEY: ${{ secrets.GROWTH_RELEASE_SIGNING_KEY }}
        run: |
          infra/release/sign.sh "dist/growth-$VERSION.zip.sha256"
          infra/release/verify.sh "dist/growth-$VERSION.zip" "dist/growth-$VERSION.zip.sha256" \
            "dist/growth-$VERSION.zip.sha256.sig" "$RUNNER_TEMP/release-signing.pub.pem"

      - name: Verificar el sha256
        working-directory: dist
        run: sha256sum --check "growth-$VERSION.zip.sha256"

      - name: Subir los assets al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/growth-$VERSION.zip"
            "dist/growth-$VERSION.zip.sha256"
            "dist/release.json"
            "dist/install.sh"
            "dist/imagina-growth-connector.zip"
          )
          assets+=(dist/imagina-growth-connector-*.zip)
          if [ "$SIGNED" = 1 ]; then
            assets+=("dist/growth-$VERSION.zip.sha256.sig" "dist/release-signing.pub.pem")
          fi
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::Falta $f en el paquete"; exit 1; }
          done
          if [ "$MODE" = create ]; then
            # Release automático: el tag apunta al commit que cambió VERSION; las notas salen de los commits.
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          else
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
