# CI del monorepo (CLAUDE.md §6): nada entra a main en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release la llama antes de publicar: una versión solo sale con el CI en verde.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-backend:
    name: Hub · Pest, Larastan, Pint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: igr_test
          MARIADB_USER: igr
          MARIADB_PASSWORD: igr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd="wget -qO- http://127.0.0.1:8123/ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, zip, pcntl, sodium, gd, exif, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('hub/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan (nivel 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pest (unidad, contrato, integración y tenancy)
        run: vendor/bin/pest --ci

  hub-frontend:
    name: Hub · SPA (TypeScript, ESLint, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: TypeScript strict
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  connector:
    name: Connector · PHPUnit (PHP ${{ matrix.php }}), PHPCS y contrato
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: connector
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_igr_tests
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_CORE_DIR: /tmp/wordpress
      WC_PLUGIN_DIR: /tmp/wordpress/wp-content/plugins/woocommerce
      WP_TESTS_DB_NAME: wp_igr_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium, zip, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: WordPress, WooCommerce y plugins de formularios para la suite de integración
        run: |
          mkdir -p /tmp/wordpress
          curl -sSL https://wordpress.org/latest.tar.gz | tar -xz -C /tmp/wordpress --strip-components=1
          for p in woocommerce contact-form-7 wpforms-lite; do
            curl -sSL -o /tmp/$p.zip https://downloads.wordpress.org/plugin/$p.latest-stable.zip
            unzip -q /tmp/$p.zip -d /tmp/wordpress/wp-content/plugins/
          done
      - name: PHPCS (WordPress-Extra)
        run: vendor/bin/phpcs -q
      - name: Unitarias
        run: vendor/bin/phpunit
      - name: WordPress + WooCommerce (contrato contra hub/resources/schemas/events)
        run: vendor/bin/phpunit -c phpunit-wp.xml.dist

  ml:
    name: ML · pytest (uv)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub/ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: hub/ml/uv.lock
      - name: Entorno desde uv.lock (falla si el lockfile no está al día)
        run: uv sync --frozen
      - name: Pruebas
        run: uv run --frozen pytest -q

  release-package:
    name: Paquete de versión (armado, firma y verificación)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, zip, pcntl, sodium, gd, exif, gmp, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Scripts de empaquetado (shellcheck)
        run: shellcheck infra/release/*.sh infra/tests/release/*.sh
      - name: Armar, firmar con una llave de usar y tirar, verificar y revisar el contenido
        run: infra/tests/release/build_test.sh

  updater-scripts:
    name: Actualizador · arnés con deployer falso y shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas (jq, zstd, zip, unzip, shellcheck, PHP CLI)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq zstd zip unzip shellcheck php-cli
      - name: shellcheck de los scripts del servidor y del arnés
        run: shellcheck -x infra/bin/growth-update infra/bin/growth-update-dispatch infra/bin/growth-system infra/bin/growth-web infra/tests/updater/run.sh infra/tests/updater/lib.sh infra/tests/updater/fakes/* infra/tests/system/run.sh
      - name: growth-env (sintaxis de PHP)
        run: php -l infra/bin/growth-env
      - name: Escenarios del actualizador (actualiza, vuelve atrás, sin espacio, zip roto, candado, despacho, .env)
        run: bash infra/tests/updater/run.sh
      - name: Configuración del sistema (perfil, memoria, prioridades) con un sistema falso
        run: sudo bash infra/tests/system/run.sh

  backup-scripts:
    name: Copias · scripts de respaldo, prueba de restauración y shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x infra/backup/growth-backup-* infra/tests/backup/*.sh
      - name: Copias y restauración con comandos falsos
        run: bash infra/tests/backup/run.sh

  tracker:
    name: Tracker · TypeScript, Vitest, tamaño (≤ 6 KB gzip) y paquetes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - run: npm ci
      - name: Tipos, pruebas, build y límite de tamaño (sin eval ni new Function)
        run: npm run check
      - name: Los paquetes compilados del connector están al día
        run: git diff --exit-code -- ../connector/assets

  tracker-e2e:
    name: Tracker · Playwright contra WooCommerce real y hub simulado
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_igr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, sodium, zip, intl
          coverage: none
          tools: composer:v2, wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - name: Connector (dependencias de producción)
        working-directory: connector
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Tienda WooCommerce de prueba con el connector
        run: |
          mkdir -p "$WP_DIR"
          wp core download --path="$WP_DIR" --locale=es_CO --allow-root
          wp config create --path="$WP_DIR" --dbname=wp_igr --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --allow-root \
            --extra-php <<'PHP'
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          PHP
          wp core install --path="$WP_DIR" --url=http://127.0.0.1:8080 --title="Tienda E2E" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --allow-root
          wp plugin install woocommerce --activate --path="$WP_DIR" --allow-root
          ln -s "$GITHUB_WORKSPACE/connector" "$WP_DIR/wp-content/plugins/imagina-growth-connector"
          wp plugin activate imagina-growth-connector --path="$WP_DIR" --allow-root
          wp igr demo-store --customers=40 --orders=80 --months=3 --path="$WP_DIR" --allow-root
      - name: Navegador
        working-directory: tracker
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        working-directory: tracker
        env:
          IGR_E2E_WP_DIR: /tmp/wordpress
          IGR_E2E_WP_CLI: wp --allow-root
        run: npm run e2e -- --trace off
