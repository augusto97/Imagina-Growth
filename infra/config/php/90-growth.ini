; Ajustes de PHP para Imagina Growth (FrankenPHP y la línea de comandos, /etc/php-zts/conf.d/90-growth.ini).
; Los mismos que tenía la imagen anterior. Lo instala infra/install.sh.
memory_limit = 512M
max_execution_time = 60
expose_php = Off
upload_max_filesize = 20M
post_max_size = 21M
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 50000
; Sin revisar fechas de archivos: cada versión vive en su propia carpeta y los servicios se reinician al cambiar.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
date.timezone = UTC
