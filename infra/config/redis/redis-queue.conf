# Redis de colas, streams de ingesta, candados y sesiones (/etc/redis/redis-queue.conf).
# Nunca borra claves (noeviction) y guarda en disco (AOF cada segundo). Lo genera infra/install.sh.
# Con tope de memoria: lleno, rechaza escrituras (el plugin reintenta) en vez de que el kernel mate procesos.
# Sin instantáneas RDB: el AOF ya guarda todo y cada `save` duplicaba la memoria con un fork.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-keepalive 300
daemonize no
supervised systemd
pidfile /run/redis-queue/redis-server.pid
loglevel notice
logfile ""
databases 16
dir /var/lib/redis-queue
dbfilename dump.rdb
save ""
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
maxmemory __QUEUE_MAXMEMORY__
maxmemory-policy noeviction
requirepass __REDIS_PASSWORD__
