# Redis de caché (/etc/redis/redis-cache.conf): sin persistencia; con la memoria llena borra lo menos usado.
# Lo genera infra/install.sh (__MAXMEMORY__ ~10 % de la memoria).
bind 127.0.0.1 -::1
protected-mode yes
port 6380
tcp-keepalive 300
daemonize no
supervised systemd
pidfile /run/redis-cache/redis-server.pid
loglevel notice
logfile ""
databases 16
dir /var/lib/redis-cache
save ""
appendonly no
maxmemory __MAXMEMORY__
maxmemory-policy allkeys-lru
requirepass __REDIS_PASSWORD__
