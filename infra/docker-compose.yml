# Entorno local de Imagina Growth (infra/README.md).
#   docker compose -f infra/docker-compose.yml up -d                # hub + datos
#   docker compose -f infra/docker-compose.yml --profile store up -d  # + tienda WooCommerce de prueba
# Panel: http://localhost:8000 · Mailpit: http://localhost:8025 · Tienda: http://localhost:8080

name: imagina-growth

x-hub: &hub
  build:
    context: ..
    dockerfile: infra/docker/hub/Dockerfile
    target: dev
  image: imagina-growth/hub:dev
  working_dir: /app
  volumes:
    - ../hub:/app
  env_file: ../hub/.env
  environment:
    DB_HOST: mariadb
    REDIS_HOST: redis
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USERNAME: igr
    CLICKHOUSE_PASSWORD: igr
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    mariadb: { condition: service_healthy }
    redis: { condition: service_healthy }
    clickhouse: { condition: service_healthy }

services:
  hub:
    <<: *hub
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports: ["8000:8000"]

  ingest-worker:
    <<: *hub
    command: php artisan igr:ingest:work
    restart: unless-stopped

  horizon:
    <<: *hub
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *hub
    command: php artisan schedule:work

  # Tiempo real (Fase 4: bandeja y «En este momento»). La SPA se conecta con VITE_REVERB_* y el hub
  # emite con BROADCAST_CONNECTION=reverb (REVERB_HOST=reverb, REVERB_PORT=8080, REVERB_SCHEME=http).
  reverb:
    <<: *hub
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8090:8080"]
    restart: unless-stopped

  # Predicciones (Fase 4): BG/NBD y Gamma-Gamma (hub/ml). El hub lo llama con IGR_ML_URL=http://ml:8095.
  ml:
    build:
      context: ../hub/ml
    environment:
      IGR_ML_TOKEN: ${IGR_ML_TOKEN:-dev-ml-token}
    ports: ["8095:8095"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')"]
      interval: 10s
      retries: 10

  vite:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes: ["../hub:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    profiles: ["frontend"]

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: igr
      MARIADB_USER: igr
      MARIADB_PASSWORD: igr
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: igr
      CLICKHOUSE_USER: igr
      CLICKHOUSE_PASSWORD: igr
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/igr.xml:/etc/clickhouse-server/config.d/igr.xml:ro
    ports: ["8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # Tienda WooCommerce de prueba con el plugin montado desde ../connector.
  # Después de levantarla: docker compose -f infra/docker-compose.yml run --rm wpcli igr-setup
  wordpress:
    image: wordpress:6-php8.3-apache
    profiles: ["store"]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: igr
      WORDPRESS_DB_PASSWORD: igr
      WORDPRESS_DB_NAME: wp_igr
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('IGR_HUB_URL', 'http://hub:8000');
    volumes:
      - wordpress:/var/www/html
      - ../connector:/var/www/html/wp-content/plugins/imagina-growth-connector
    depends_on:
      mariadb: { condition: service_healthy }

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["store"]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: igr
      WORDPRESS_DB_PASSWORD: igr
      WORDPRESS_DB_NAME: wp_igr
    volumes:
      - wordpress:/var/www/html
      - ../connector:/var/www/html/wp-content/plugins/imagina-growth-connector
      - ./wordpress/igr-setup.sh:/usr/local/bin/igr-setup:ro
    depends_on: [wordpress]

volumes:
  mariadb:
  clickhouse:
  redis:
  wordpress:
